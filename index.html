<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>잉글리시팝 입문교육 신청</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --navy:#0B43A0; --navy-d:#072F76; --navy-l:#2C68D4;
  --orange:#FF6400; --orange-d:#E05400; --orange-l:#FFF1E6;
  --yellow:#FFD84D;
  --bg:#F3F8FF; --card:#FFFFFF; --sky:#E9F1FF;
  --ink:#16233A; --muted:#6B7A99; --line:#D9E5F8;
  --shadow:0 6px 0 rgba(11,67,160,.07), 0 14px 30px rgba(11,67,160,.09);
  --r:22px;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1730; --card:#16243F; --sky:#1C2D4F;
    --ink:#EAF1FF; --muted:#9DB0D4; --line:#2A3A5C;
    --orange-l:#3A2313;
    --shadow:0 6px 0 rgba(0,0,0,.25), 0 14px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0B1730; --card:#16243F; --sky:#1C2D4F;
  --ink:#EAF1FF; --muted:#9DB0D4; --line:#2A3A5C;
  --orange-l:#3A2313;
  --shadow:0 6px 0 rgba(0,0,0,.25), 0 14px 30px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.jua{font-family:"Jua","Noto Sans KR",sans-serif; font-weight:400; letter-spacing:-.01em}
img{max-width:100%}
button{font-family:inherit; cursor:pointer}
:focus-visible{outline:3px solid var(--orange); outline-offset:2px; border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation:none !important; transition:none !important}}

.wrap{max-width:980px; margin:0 auto; padding:0 18px}

/* ---------- header ---------- */
header.top{
  position:sticky; top:0; z-index:40;
  background:color-mix(in srgb, var(--card) 88%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.top-in{display:flex; align-items:center; gap:12px; height:62px}
.logo{height:26px; width:auto; display:block}
/* the logo is navy-on-white, so it rides on a white pill in dark contexts */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .logo,
  :root:not([data-theme="light"]) footer .lock img{
    background:#fff; padding:4px 10px; border-radius:999px;
  }
}
:root[data-theme="dark"] .logo,
:root[data-theme="dark"] footer .lock img{background:#fff; padding:4px 10px; border-radius:999px}
.top-title{font-size:15px; color:var(--muted); padding-left:12px; border-left:1px solid var(--line)}
.spacer{flex:1}
.admin-dot{width:7px; height:7px; border-radius:50%; background:currentColor; opacity:.35}
.admin-toggle{
  border:2px solid var(--line); background:transparent; color:var(--muted);
  border-radius:999px; padding:7px 14px; font-size:13px; font-weight:700; transition:all .15s;
  display:flex; align-items:center; gap:7px;
}
.admin-toggle:hover{border-color:var(--navy-l); color:var(--navy-l)}
.admin-toggle.on{background:var(--navy); border-color:var(--navy); color:#fff}
.admin-toggle.on .admin-dot{background:var(--yellow); opacity:1; box-shadow:0 0 0 3px rgba(255,216,77,.3)}
@media (max-width:560px){ .top-title{display:none} }

/* password modal */
.modal-bg{
  position:fixed; inset:0; z-index:80; background:rgba(9,25,55,.55);
  display:flex; align-items:center; justify-content:center; padding:18px;
}
.modal{
  background:var(--card); border-radius:24px; box-shadow:0 20px 50px rgba(0,0,0,.3);
  padding:26px 24px 22px; width:100%; max-width:360px; text-align:center; position:relative;
}
.modal img.guard{width:86px; margin:-62px 0 -2px}
.modal h3{font-size:20px; margin:4px 0 4px}
.modal p{color:var(--muted); font-size:13.5px; margin:0 0 16px}
.modal input{text-align:center; letter-spacing:.06em}
.modal .err{color:var(--orange-d); font-size:13px; font-weight:700; min-height:19px; margin:9px 0 0}
:root[data-theme="dark"] .modal .err{color:var(--yellow)}
.modal .row{display:flex; gap:9px; margin-top:12px}
.modal .row .btn{flex:1; padding:12px 0; font-size:15px}

/* ---------- hero ---------- */
.hero{position:relative; overflow:hidden; background:var(--navy); color:#fff}
.hero::before{
  content:""; position:absolute; inset:0;
  background:
    radial-gradient(circle at 12% 120%, rgba(255,255,255,.10) 0 38%, transparent 39%),
    radial-gradient(circle at 12% 120%, rgba(255,255,255,.10) 0 52%, transparent 53%),
    radial-gradient(circle at 12% 120%, rgba(255,255,255,.10) 0 66%, transparent 67%);
}
.hero::after{
  content:""; position:absolute; top:0; right:0; width:46%; height:100%;
  background:var(--orange);
  clip-path:polygon(38% 0, 100% 0, 100% 100%, 0 100%);
}
@media (max-width:700px){ .hero::after{width:100%; height:42%; top:auto; bottom:0; clip-path:polygon(0 42%, 100% 0, 100% 100%, 0 100%)} }
.hero-in{position:relative; z-index:2; display:flex; align-items:flex-end; gap:20px; padding:30px 0 0}
.hero-copy{flex:1; padding-bottom:34px; min-width:0}
.badge{
  display:inline-flex; align-items:center; gap:6px;
  background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.35);
  padding:5px 13px; border-radius:999px; font-size:13px; font-weight:700; margin-bottom:12px;
}
.badge.live{background:var(--yellow); border-color:var(--yellow); color:#4A3200}
.badge.closed{background:rgba(0,0,0,.25); border-color:rgba(255,255,255,.25)}
.hero h1{font-size:clamp(28px,5.2vw,42px); margin:0 0 8px; line-height:1.2}
.hero .sub{opacity:.88; font-size:15px; margin:0}
.hero-char{position:relative; width:230px; flex:none; align-self:flex-end}
.hero-char img.dino{display:block; width:100%; filter:drop-shadow(0 12px 18px rgba(0,0,0,.22))}
.speech{
  position:absolute; top:-6px; left:-118px; width:186px;
  background:#fff; color:var(--navy); border-radius:18px 18px 4px 18px;
  padding:11px 14px; font-size:13.5px; font-weight:700; line-height:1.45;
  box-shadow:0 8px 18px rgba(0,0,0,.18);
}
.speech::after{content:""; position:absolute; right:-9px; bottom:8px; width:0; height:0;
  border:9px solid transparent; border-left-color:#fff; border-right:0}
@media (max-width:760px){
  .hero-in{padding-top:22px}
  .hero-char{width:150px}
  .speech{display:none}
}
.wave{display:block; width:100%; height:26px; margin-top:-1px}

/* ---------- tabs ---------- */
nav.tabs{display:flex; gap:8px; margin:20px 0 0; flex-wrap:wrap}
.tab{
  border:2px solid var(--line); background:var(--card); color:var(--muted);
  border-radius:999px; padding:9px 18px; font-size:14.5px; font-weight:700;
  font-family:"Jua","Noto Sans KR",sans-serif; transition:all .15s;
}
.tab:hover{color:var(--navy-l); border-color:var(--navy-l)}
.tab[aria-selected="true"]{background:var(--navy); border-color:var(--navy); color:#fff}
.tab .cnt{font-size:12px; opacity:.75; margin-left:5px}

/* ---------- cards ---------- */
.panel{padding:22px 0 60px}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:26px; margin-bottom:18px; position:relative;
}
.card-head{display:flex; align-items:center; gap:12px; margin:0 0 4px}
.card-head img{width:44px; height:auto; flex:none}
.card h2{font-size:21px; margin:0}
.card .lead{color:var(--muted); font-size:14px; margin:2px 0 20px}
.card-mascot{position:absolute; right:20px; top:-26px; width:74px; pointer-events:none}
@media (max-width:640px){.card{padding:20px 16px} .card-mascot{width:54px; top:-18px; right:12px}}

/* ---------- form ---------- */
.grid{display:grid; grid-template-columns:1fr 1fr; gap:14px 16px}
.grid .full{grid-column:1 / -1}
@media (max-width:640px){.grid{grid-template-columns:1fr}}
label.f{display:block; font-size:13px; font-weight:700; color:var(--ink); margin-bottom:6px}
label.f .req{color:var(--orange); margin-left:3px}
label.f .hint{font-weight:400; color:var(--muted); font-size:12px; margin-left:5px}
input[type=text],input[type=tel],input[type=date],input[type=number],select,textarea{
  width:100%; padding:11px 13px; font-size:14.5px; font-family:inherit; color:var(--ink);
  background:var(--bg); border:2px solid var(--line); border-radius:13px; transition:border-color .15s;
}
input:focus,select:focus,textarea:focus{border-color:var(--navy-l); outline:none}
input::placeholder,textarea::placeholder{color:var(--muted); opacity:.7}
textarea{resize:vertical; min-height:62px}
.range{display:flex; align-items:center; gap:9px}
.range span{color:var(--muted); flex:none}

.chips{display:flex; gap:8px; flex-wrap:wrap}
.chip{
  border:2px solid var(--line); background:var(--bg); color:var(--muted);
  border-radius:999px; padding:9px 16px; font-size:14px; font-weight:700; transition:all .13s;
}
.chip[aria-pressed="true"]{background:var(--orange-l); border-color:var(--orange); color:var(--orange-d)}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:var(--yellow)}

/* session picker */
.sessions{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px}
.sess{
  text-align:left; border:2.5px solid var(--line); background:var(--bg);
  border-radius:18px; padding:14px 16px; transition:all .15s; position:relative; color:var(--ink);
}
.sess:hover:not([disabled]){border-color:var(--navy-l)}
.sess[aria-pressed="true"]{border-color:var(--orange); background:var(--orange-l)}
.sess[disabled]{opacity:.55; cursor:not-allowed}
.sess .d{font-family:"Jua"; font-size:19px; line-height:1.2}
.sess .w{font-size:12.5px; color:var(--muted); margin-bottom:9px}
.bar{height:7px; background:var(--line); border-radius:99px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--navy-l); border-radius:99px; transition:width .4s}
.bar i.warn{background:var(--orange)}
.bar i.fullb{background:#B9C4D8}
.sess .n{font-size:12.5px; margin-top:6px; font-weight:700; color:var(--muted)}
.sess .n b{color:var(--navy-l)}
.sess[aria-pressed="true"] .n b{color:var(--orange-d)}
:root[data-theme="dark"] .sess[aria-pressed="true"] .n b{color:var(--yellow)}

/* buttons */
.btn{
  border:none; border-radius:16px; padding:14px 26px; font-size:16px; font-weight:700;
  font-family:"Jua","Noto Sans KR",sans-serif; transition:transform .1s, box-shadow .15s;
}
.btn-main{background:var(--orange); color:#fff; box-shadow:0 5px 0 var(--orange-d)}
.btn-main:hover{transform:translateY(-1px)}
.btn-main:active{transform:translateY(3px); box-shadow:0 2px 0 var(--orange-d)}
.btn-main[disabled]{background:#B9C4D8; box-shadow:0 5px 0 #98A5BC; cursor:not-allowed; transform:none}
.btn-navy{background:var(--navy); color:#fff; box-shadow:0 5px 0 var(--navy-d)}
.btn-navy:active{transform:translateY(3px); box-shadow:0 2px 0 var(--navy-d)}
.btn-ghost{background:transparent; border:2px solid var(--line); color:var(--muted); padding:12px 20px; font-size:14px; border-radius:14px}
.btn-ghost:hover{border-color:var(--navy-l); color:var(--navy-l)}
.btn-sm{padding:8px 14px; font-size:13px; border-radius:11px}
.actions{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:22px}
.actions .note{color:var(--muted); font-size:13px}

/* session editor rows */
.srow{display:flex; gap:10px; align-items:flex-end; margin-bottom:10px; flex-wrap:wrap}
.srow .col{flex:1; min-width:130px}
.srow .del{border:2px solid var(--line); background:transparent; color:var(--muted); border-radius:11px; padding:10px 13px; font-size:13px; font-weight:700}
.srow .del:hover{border-color:var(--orange); color:var(--orange)}

/* status / roster */
.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:22px}
.stat{background:var(--sky); border-radius:16px; padding:14px 16px}
.stat .k{font-size:12.5px; color:var(--muted); font-weight:700}
.stat .v{font-family:"Jua"; font-size:26px; line-height:1.25; color:var(--navy-l)}
:root[data-theme="dark"] .stat .v{color:var(--yellow)}
.day-block{border:1px solid var(--line); border-radius:18px; padding:16px 18px; margin-bottom:14px; background:var(--bg)}
.day-head{display:flex; align-items:baseline; gap:10px; margin-bottom:10px; flex-wrap:wrap}
.day-head h3{font-size:17px; margin:0}
.day-head .cap{font-size:13px; color:var(--muted); font-weight:700}
.tag{font-size:12px; font-weight:700; padding:3px 10px; border-radius:999px; border:2px solid var(--line); color:var(--muted)}
.tag.open{background:var(--yellow); border-color:var(--yellow); color:#4A3200}
.tag.soon{border-color:var(--navy-l); color:var(--navy-l)}
.tag.full,.tag.done{background:var(--line); border-color:var(--line)}
.people{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}
.person{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:7px 12px; font-size:13.5px}
.person b{font-weight:700}
.person span{color:var(--muted); margin-left:5px; font-size:12.5px}
.tbl-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch; margin-top:12px; border:1px solid var(--line); border-radius:14px}
table{border-collapse:collapse; width:100%; font-size:13px; min-width:940px; background:var(--card)}
th,td{padding:9px 11px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap}
th{background:var(--sky); font-weight:700; font-size:12.5px; color:var(--muted); position:sticky; top:0}
tbody tr:last-child td{border-bottom:none}
.rm{border:none; background:transparent; color:var(--muted); font-size:12px; font-weight:700; padding:3px 7px; border-radius:8px}
.rm:hover{background:var(--orange-l); color:var(--orange-d)}

/* empty / done */
.empty{text-align:center; padding:34px 16px}
.empty img{width:130px; margin-bottom:6px}
.empty p{color:var(--muted); margin:6px 0 0; font-size:14.5px}
.empty .big{font-family:"Jua"; font-size:19px; color:var(--ink); margin-bottom:2px}
.done-box{text-align:center; padding:12px 0 4px}
.done-box img{width:170px}
.done-box h2{margin:8px 0 4px; font-size:24px}
.done-box p{color:var(--muted); margin:0 0 6px}
.receipt{
  display:inline-block; text-align:left; background:var(--sky); border-radius:18px;
  padding:16px 22px; margin:14px auto 0; font-size:14px; border:2px dashed var(--navy-l);
}
.receipt dt{color:var(--muted); font-size:12.5px; font-weight:700}
.receipt dd{margin:0 0 9px; font-weight:700}
.receipt dl{margin:0}

.alert{
  display:flex; gap:12px; align-items:center; background:var(--orange-l); border:2px solid var(--orange);
  border-radius:16px; padding:13px 16px; font-size:14px; font-weight:700; color:var(--orange-d); margin-bottom:18px;
}
:root[data-theme="dark"] .alert{color:var(--yellow)}
.alert img{width:40px; flex:none}
.info{background:var(--sky); border-radius:14px; padding:12px 16px; font-size:13.5px; color:var(--muted); margin-bottom:18px}
.info b{color:var(--ink)}

footer{border-top:1px solid var(--line); padding:26px 0 40px; text-align:center; color:var(--muted); font-size:13px}
footer .lock{display:flex; align-items:center; justify-content:center; gap:9px; margin-bottom:8px}
footer .lock img{height:20px; opacity:.85}
footer .lock i{font-style:normal; font-size:12px; letter-spacing:.04em; border-left:1px solid var(--line); padding-left:9px}
.hidden{display:none !important}
.toast{
  position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
  background:var(--navy); color:#fff; padding:12px 22px; border-radius:14px;
  font-weight:700; font-size:14px; box-shadow:0 10px 26px rgba(0,0,0,.25); z-index:90;
}
</style>
</head>

const ERRS = {

  no_batch:"기수 정보를 찾지 못했어요", no_session:"교육 일자를 찾지 못했어요"
};
async function apiGet(){
  if(!API) throw new Error("no_api");
  const url = API + (API.includes("?") ? "&" : "?") + "t=" + Date.now() + (adminKey ? "&key="+encodeURIComponent(adminKey) : "");
  const r = await fetch(url);
  return await r.json();
}
async function apiPost(body){
  if(!API) throw new Error("no_api");
  const r = await fetch(API, {
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},  // 미리 요청(preflight) 회피
    body: JSON.stringify(body)
  });
  return await r.json();
}
async function reload(){
  if(loading) return;
  loading = true;
  try{
    const d = await apiGet();
    if(d && d.ok){
      batches = (d.batches||[]).map(b=>({...b, sessions: Array.isArray(b.sessions)?b.sessions:[]}));
      apps = d.apps || [];
      if(adminKey && !d.admin){ adminKey = null; setAdmin(false); toast("관리자 세션이 풀렸어요"); }
    }
  }catch(e){
    if(String(e.message)!=="no_api") toast("정보를 불러오지 못했어요");
  }
  loading = false;
  afterData();
}

/* ---------- 기수 헬퍼 ---------- */
const byId = id => batches.find(b=>b.id===id) || null;
const sorted = () => batches.slice().sort((a,b)=>(b.no||0)-(a.no||0));
function phase(b){
  if(!b) return "none";
  const t = today();
  if(b.applyStart && t < b.applyStart) return "before";
  if(b.applyEnd && t > b.applyEnd) return "after";
  return "open";
}
const appsOf = b => b ? apps.filter(a=>a.batchId===b.id) : [];
const countFor = (b,sid) => appsOf(b).filter(a=>a.sessionId===sid).length;
const allFull = b => b && b.sessions.length>0 && b.sessions.every(s=>countFor(b,s.id) >= s.capacity);
const openBatches = () => sorted().filter(b=>phase(b)==="open" && !allFull(b));
function curBatch(){
  const open = openBatches();
  if(applyId){ const hit = open.find(b=>b.id===applyId); if(hit) return hit; }
  if(open.length) return open[0];
  const soon = sorted().filter(b=>phase(b)==="before");
  if(soon.length) return soon[soon.length-1];
  return sorted()[0] || null;
}
function statusOf(b){
  if(allFull(b)) return {k:"full", t:"정원 마감"};
  const p = phase(b);
  if(p==="open") return {k:"open", t:"모집 중"};
  if(p==="before") return {k:"soon", t:"모집 예정"};
  return {k:"done", t:"종료"};
}

/* ---------- hero ---------- */
function renderHero(){
  const b = curBatch();
  const badge = $("#heroBadge"), t = $("#heroTitle"), s = $("#heroSub"), sp = $("#speech");
  badge.className = "badge";
  if(!b){
    badge.textContent = "준비 중"; t.textContent = "잉글리시팝 신규원장 입문교육";
    s.textContent = API ? "기수가 아직 열리지 않았어요." : "서버 주소가 아직 연결되지 않았어요."; sp.textContent = "곧 만나요!";
    return;
  }
  t.textContent = `${b.no}기 신규원장 입문교육`;
  const st = statusOf(b);
  if(st.k==="open"){
    badge.classList.add("live"); badge.textContent = `신청 받는 중 · ${fmtShort(b.applyEnd)}까지`;
    sp.textContent = "교육일부터 골라볼까요?";
  } else if(st.k==="soon"){
    badge.textContent = `${fmtShort(b.applyStart)} 신청 시작`; sp.textContent = "조금만 기다려 주세요!";
  } else if(st.k==="full"){
    badge.classList.add("closed"); badge.textContent = "정원 마감"; sp.textContent = "자리가 모두 찼어요.";
  } else {
    badge.classList.add("closed"); badge.textContent = "신청 마감"; sp.textContent = "다음 기수에서 만나요.";
  }
  const on = (b.onlineStart||b.onlineEnd) ? `온라인 ${fmtShort(b.onlineStart)}~${fmtShort(b.onlineEnd)}` : "";
  const off = b.sessions.length ? `오프라인 ${b.sessions.map(x=>fmtShort(x.date)).join(" · ")}` : "";
  s.textContent = [on, off].filter(Boolean).join("   |   ");
}

function setTab(name){
  tab = name;
  ["apply","list","setup"].forEach(k=>{
    $("#tab-"+k).setAttribute("aria-selected", String(k===name));
    $("#p-"+k).classList.toggle("hidden", k!==name);
  });
  if(name==="list"){ renderList(); reload(); }
  if(name==="setup") renderSetup();
}

function setAdmin(v){
  isAdmin = v;
  $("#adminBtn").classList.toggle("on", v);
  $("#adminBtn").title = v ? "누르면 관리자 모드에서 나가요" : "본사 관리자 전용";

  $("#tab-apply").classList.toggle("hidden", v);
  try{
    if(v) sessionStorage.setItem("ep_key", adminKey||"");
    else { sessionStorage.removeItem("ep_key"); adminKey = null; }
  }catch(e){}
  if(v && tab==="apply") setTab("setup");
  else if(!v && tab==="setup") setTab("apply");
  else { renderSetup(); renderList(); }
}
function openGate(){
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="관리자 모드">
    <img class="guard" src="${ASSETS.peek}" alt="">
    <h3>관리자 모드</h3>
    <p>기수를 열고 신청자 명단을 관리하는 화면이에요.</p>
    <input type="password" id="gatePw" placeholder="비밀번호" autocomplete="off">
    <div class="err" id="gateErr"></div>
    <div class="row">
      <button class="btn btn-ghost" id="gateCancel">닫기</button>
      <button class="btn btn-navy" id="gateOk">들어가기</button>
    </div>
  </div>`;
  document.body.appendChild(bg);
  const pw = bg.querySelector("#gatePw"), err = bg.querySelector("#gateErr");
  pw.focus();
  const close = () => bg.remove();
  const tryIn = async () => {
    const key = pw.value.trim();
    if(!key) return;
    err.textContent = "확인 중…";
    try{
      const r = await apiPost({action:"login", key});
      if(r && r.ok){ adminKey = key; close(); setAdmin(true); await reload(); toast("관리자 모드로 들어왔어요"); }
      else { err.textContent = ERRS.auth; pw.select(); }
    }catch(e){ err.textContent = "서버에 연결하지 못했어요"; }
  };
  bg.querySelector("#gateOk").addEventListener("click", tryIn);
  bg.querySelector("#gateCancel").addEventListener("click", close);
  pw.addEventListener("keydown", e=>{ if(e.key==="Enter") tryIn(); });
  bg.addEventListener("click", e=>{ if(e.target===bg) close(); });
  document.addEventListener("keydown", function esc2(e){
    if(e.key==="Escape"){ close(); document.removeEventListener("keydown", esc2); }
  });
}

function drawSessEdit(){
  const box = $("#sessEdit");
  box.innerHTML = editData.sessions.map((s,i)=>`<div class="srow" data-i="${i}">
    <div class="col"><label class="f">날짜</label><input type="date" class="e-date" value="${s.date||""}"></div>

  </div>`).join("") || `<p style="color:var(--muted); font-size:13.5px; margin:4px 0 10px">아직 일자가 없어요. 아래에서 추가해 주세요.</p>`;

    row.querySelector(".e-cap").addEventListener("change", e=> editData.sessions[i].capacity = +e.target.value||0);
    row.querySelector(".del").addEventListener("click", ()=>{ editData.sessions.splice(i,1); drawSessEdit(); });

async function saveBatch(){
  const d = editData;
  if(!d.no) return toast("기수를 입력해 주세요");
  if(!d.applyStart || !d.applyEnd) return toast("신청 기간을 입력해 주세요");
  const sess = d.sessions.filter(s=>s.date).sort((a,b)=>a.date.localeCompare(b.date));
  if(!sess.length) return toast("오프라인 교육 일자를 추가해 주세요");
  if(editId==="new" && byId(String(d.no))) return toast(`${d.no}기가 이미 있어요`);
  $("#saveCfg").disabled = true;
  $("#saveNote").textContent = "저장 중…";
  try{
    const r = await apiPost({action:"saveBatch", key:adminKey, oldId: editId==="new"?null:editId,
      batch:{no:d.no, applyStart:d.applyStart, applyEnd:d.applyEnd,
        onlineStart:d.onlineStart, onlineEnd:d.onlineEnd, sessions:sess}});
    if(r && r.ok){ editId=null; editData=null; await reload(); toast(`${d.no}기를 저장했어요`); renderSetup(); }
    else { $("#saveNote").textContent = ERRS[r&&r.error] || "저장하지 못했어요"; }
  }catch(e){ $("#saveNote").textContent = "서버에 연결하지 못했어요"; }
  const btn = $("#saveCfg"); if(btn) btn.disabled = false;
}
async function delBatch(id){
  const b = byId(id), n = appsOf(b).length;
  const msg = n ? `${b.no}기를 지울까요? 시트의 신청자 ${n}명은 남지만 명단 화면에서 볼 수 없게 돼요.` : `${b.no}기를 지울까요?`;
  if(!confirm(msg)) return;
  try{
    const r = await apiPost({action:"deleteBatch", key:adminKey, id});
    if(r && r.ok){ if(viewId===id) viewId=null; await reload(); toast("지웠어요"); renderSetup(); }
    else toast("지우지 못했어요");
  }catch(e){ toast("서버에 연결하지 못했어요"); }
}

/* ---------- 신청 ---------- */
function renderGate(){
  const gate = $("#applyGate"), body = $("#applyBody");
  const b = curBatch();
  let html = "", block = false;
  if(!API){
    html = `<div class="card"><div class="empty"><img src="${ASSETS.empty}" alt="">
      <div class="big">서버 주소가 비어 있어요</div>
      <p>index.html 맨 위의 API 값에 Apps Script 주소를 넣어주세요.</p></div></div>`;
    block = true;
  } else if(!b){
    html = `<div class="card"><div class="empty"><img src="${ASSETS.empty}" alt="">
      <div class="big">아직 열린 기수가 없어요</div>
      <p>관리자 모드에서 기수를 먼저 등록해 주세요.</p></div></div>`;
    block = true;
  } else if(phase(b)==="before"){
    html = `<div class="alert"><img src="${ASSETS.peek}" alt="">${b.no}기 신청은 ${fmt(b.applyStart)}부터 받아요.</div>`;
    block = true;
  } else if(phase(b)==="after"){
    html = `<div class="card"><div class="empty"><img src="${ASSETS.full}" alt="">
      <div class="big">${b.no}기 신청이 마감됐어요</div>
      <p>신청 기간은 ${fmt(b.applyStart)} ~ ${fmt(b.applyEnd)}였어요.</p></div></div>`;
    block = true;
  } else if(allFull(b)){
    html = `<div class="card"><div class="empty"><img src="${ASSETS.full}" alt="">
      <div class="big">모든 일자가 찼어요</div>
      <p>자리가 나는지 본부 교육팀에 문의해 주세요.</p></div></div>`;
    block = true;
  } else {
    const open = openBatches();
    if(open.length > 1){
      html += `<div class="chips" id="applyPick" style="margin:0 0 16px">
        ${open.map(x=>`<button class="chip" data-a="${x.id}" aria-pressed="${x.id===b.id}">${x.no}기</button>`).join("")}
      </div>`;
    }
    html += `<div class="info">신청 기간 <b>${fmt(b.applyStart)} ~ ${fmt(b.applyEnd)}</b>
      · 온라인 교육 <b>${fmt(b.onlineStart)} ~ ${fmt(b.onlineEnd)}</b><br>
      온라인 교육을 모두 들은 뒤 오프라인 교육에 참석합니다.</div>`;
  }
  gate.innerHTML = html;
  body.classList.toggle("hidden", block);
  const pick = $("#applyPick");
  if(pick) pick.querySelectorAll("[data-a]").forEach(el=> el.addEventListener("click", ()=>{
    if(applyId === el.dataset.a) return;
    applyId = el.dataset.a; picked = null;
    renderHero(); renderGate(); renderSessPick(); checkReady();
  }));
}
function renderSessPick(){
  const b = curBatch(); if(!b) return;
  const box = $("#sessPick");
  box.innerHTML = b.sessions.map(s=>{
    const n = countFor(b,s.id), left = Math.max(0, s.capacity-n), pct = Math.min(100, Math.round(n/s.capacity*100));
    const cls = left===0 ? "fullb" : (left<=3 ? "warn" : "");
    return `<button class="sess" data-id="${s.id}" ${left===0?"disabled":""} aria-pressed="${picked===s.id}">
      <div class="d">${fmt(s.date)}</div>
      <div class="w">${left===0?"정원이 찼어요":"오프라인 교육"}</div>
      <div class="bar"><i class="${cls}" style="width:${pct}%"></i></div>
      <div class="n">${left===0 ? `${s.capacity}명 마감` : `남은 자리 <b>${left}</b>명 <span style="font-weight:400">/ ${s.capacity}명</span>`}</div>
    </button>`;
  }).join("");
  box.querySelectorAll(".sess").forEach(el=> el.addEventListener("click", ()=>{
    picked = el.dataset.id; renderSessPick(); checkReady();
  }));
}

function ready(){
  return picked && $("#f-hq").value.trim() && $("#f-branch").value.trim() && $("#f-name").value.trim()
    && $("#f-eng").value.trim() && $("#f-phone").value.trim() && $("#f-addr").value.trim()
    && chipState.gender && chipState.size && chipState.room && chipState.career && chipState.fc;
}
function checkReady(){
  const ok = ready();
  const btn = $("#submitBtn");
  if(btn.dataset.busy === "1") return;
  btn.disabled = !ok;
  $("#submitNote").textContent = ok ? "" : "필수 항목을 채워주세요";
}
$("#submitBtn").addEventListener("click", async ()=>{
  if(!ready()) return;
  const b = curBatch();
  const sess = b.sessions.find(s=>s.id===picked);
  const rec = {
    batchId: b.id, sessionId: picked, sessionDate: sess.date,
    hq: $("#f-hq").value.trim(), branch: $("#f-branch").value.trim(), name: $("#f-name").value.trim(),
    eng: $("#f-eng").value.trim(), phone: $("#f-phone").value.trim(), addr: $("#f-addr").value.trim(),
    note: $("#f-note").value.trim(),
    role: chipState.role, gender: chipState.gender, size: chipState.size,
    room: chipState.room, career: chipState.career, fc: chipState.fc
  };
  const btn = $("#submitBtn");
  btn.disabled = true; btn.dataset.busy = "1";
  $("#submitNote").textContent = "보내는 중…";
  try{
    const r = await apiPost({action:"apply", rec});
    if(r && r.ok){
      localSet("ep_mine_"+b.id, {name:rec.name, date:sess.date});
      await reload();
      showDone(rec, b);
    } else {
      $("#submitNote").textContent = ERRS[r&&r.error] || "신청을 보내지 못했어요";
      if(r && r.error==="full"){ await reload(); picked = null; renderSessPick(); }
      btn.dataset.busy = "0"; checkReady();
    }
  }catch(e){
    $("#submitNote").textContent = "서버에 연결하지 못했어요. 다시 시도해 주세요";
    btn.dataset.busy = "0"; checkReady();
  }
});

  const pick = $("#batchPick");
  if(pick) pick.querySelectorAll("[data-b]").forEach(el=> el.addEventListener("click", ()=>{ viewId = el.dataset.b; renderList(); }));
  box.querySelectorAll("[data-drop]").forEach(el=> el.addEventListener("click", async ()=>{
    if(!confirm("이 신청을 지울까요? 구글 시트에서도 사라져요.")) return;
    try{
      const r = await apiPost({action:"deleteApplicant", key:adminKey, id:el.dataset.drop});
      if(r && r.ok){ await reload(); toast("지웠어요"); } else toast("지우지 못했어요");
    }catch(e){ toast("서버에 연결하지 못했어요"); }
  }));
  const dl = $("#dlBtn");
  if(dl) dl.addEventListener("click", ()=>downloadXlsx(b));
}

/* ---------- xlsx ---------- */
function downloadXlsx(b){
  const note = $("#dlNote");
  try{
    const wb = XLSX.utils.book_new();
    b.sessions.forEach(s=>{
      const rows = appsOf(b).filter(a=>a.sessionId===s.id)
        .sort((x,y)=>(x.createdAt||"").localeCompare(y.createdAt||""))
        .map((a,i)=>{
          const o = {"No.": i+1};
          FIELDS.forEach(f=> o[f[1]] = a[f[0]] || "");
          return o;
        });
      const ws = XLSX.utils.json_to_sheet(rows.length ? rows : [Object.fromEntries([["No.",""]].concat(FIELDS.map(f=>[f[1],""])))]);
      ws["!cols"] = [{wch:5}].concat(FIELDS.map(f=> f[0]==="addr" ? {wch:40} : (f[0]==="note" ? {wch:22} : {wch:13})));
      const d = new Date(s.date+"T00:00:00");
      XLSX.utils.book_append_sheet(wb, ws, `${d.getMonth()+1}월${d.getDate()}일(${DAYS[d.getDay()]})`);
    });
    const buf = XLSX.write(wb, {bookType:"xlsx", type:"array"});
    const blob = new Blob([buf], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `${b.no}기_잉글리시팝_신규원장_입문교육_신청.xlsx`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1500);
    note.textContent = "";
  }catch(e){ note.textContent = "내려받지 못했어요. 다시 시도해 주세요."; }
}

/* ---------- boot ---------- */
function afterData(){
  renderHero(); renderGate(); renderSessPick(); checkReady();
  $("#tabCnt").textContent = apps.length ? `(${apps.length})` : "";
  if(tab==="list") renderList();
  if(tab==="setup" && !editId) renderSetup();
}
(async function init(){
  try{ adminKey = sessionStorage.getItem("ep_key") || null; }catch(e){}
  setAdmin(!!adminKey);
  afterData();
  if(API) await reload();
})();
</script>
